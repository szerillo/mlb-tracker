name: kalshi-prop-scan
# BARTOLO daily prop scan. Times are UTC (ET + 4 during EDT):
# 9:05 PM ET (next-day listings), 10:05 AM, 1:05 PM, 4:05 PM, 6:05 PM ET.
on:
  schedule:
    - cron: '5 1,14,17,20,22 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
# prop scan + order-book job both write data/prop_scan: run one at a time (queued, never cancelled)
concurrency:
  group: bartolo-prop-data
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy
      - name: scan
        env: {SCAN_DIR: data/prop_scan}
        run: python scripts/prop_scan.py
      - name: grade
        env: {SCAN_DIR: data/prop_scan}
        run: python scripts/scan_grade.py || true
      - name: archive dashboard board (calls, prices, closes)
        env: {SCAN_DIR: data/prop_scan}
        run: python scripts/props_board_archive.py || true
      - name: grade board + tickets
        env: {SCAN_DIR: data/prop_scan}
        run: python scripts/board_grade.py || true
      - name: paper bet tracker
        run: python scripts/build_bet_tracker.py || true
      - name: commit
        run: |
          git config user.name "bartolo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prop_scan data/bet_tracker.json
          git commit -m "prop scan $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
