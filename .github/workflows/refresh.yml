name: Data refresh

on:
  schedule:
    # Game hours: every 15 min noon – 7:45 PM ET
    - cron: "*/15 16-23 * * *"
    # Late-game hourly: 8 PM, 9 PM, 10 PM, 11 PM, 12 AM, 1 AM, 2 AM ET
    - cron: "0 0,1,2,3,4,5,6 * * *"
    # Odds anchor: 11:30 PM ET (late line snapshot for CLV)
    - cron: "30 3 * * *"
    # Overnight anchors: 3 AM + 5 AM ET (fill the 2am→8am dead zone)
    - cron: "0 7,9 * * *"
    # Morning passes: 8 AM + 10 AM + 11 AM ET (pull early lineups/odds for day games)
    - cron: "0 12,14,15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force all refresh steps to run regardless of game window"
        type: boolean
        default: true
      backfill_start:
        description: "BARTOLO backfill start date (YYYY-MM-DD); requires .backfill-now present"
        type: string
        default: ""
      backfill_end:
        description: "BARTOLO backfill end date (YYYY-MM-DD); blank = yesterday"
        type: string
        default: ""
      backfill_force:
        description: "Re-run BARTOLO backfill over dates whose archive already exists (1 = force)"
        type: string
        default: ""
  # Manual trigger: push to .manual-trigger to force a run
  push:
    paths:
      - ".manual-trigger"
      - ".train-now"
      - ".backfill-now"

concurrency:
  group: refresh
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps for enrichment scripts
        run: pip install requests beautifulsoup4 unidecode pandas numpy scikit-learn pyarrow pybaseball

      - name: Migrate misplaced files (idempotent self-heal)
        run: |
          mkdir -p data/odds_archive scripts
          if ls data/2026-*.json >/dev/null 2>&1; then
            echo "Moving odds archive JSONs from data/ to data/odds_archive/"
            mv data/2026-*.json data/odds_archive/
          fi
          if [ -f data/scrape_action_archive.py ]; then
            echo "Moving scrape_action_archive.py from data/ to scripts/"
            mv data/scrape_action_archive.py scripts/
          fi
        continue-on-error: true

      - name: Refresh umpire stats
        run: python scripts/refresh_umps.py
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: Compute bullpen fatigue
        run: python scripts/compute_fatigue.py
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: Refresh weather forecasts
        run: python scripts/refresh_weather.py
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: Refresh lineups (confirmed + projected)
        run: python scripts/refresh_lineups.py
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      # Apply platoon-aware projections (vs RHP/LHP) for every game in the
      # lookahead window (today + 5 days). Skips sides where MLB confirmed
      # already exists, and skips entirely when opposing-SP hand is unknown
      # (rather than wrong-handing the lineup).
      - name: Apply Rotowire platoon projections (today + 5-day lookahead)
        run: |
          python scripts/rotowire_platoons.py data/lineups.json > /tmp/l.json && mv /tmp/l.json data/lineups.json || true
        continue-on-error: true

      # Hand-entered lineup overrides (data/lineup_overrides.json) win over the
      # scraped projection while a game is still projected — fixes games where
      # the scraped order has wrong positions / no DH. Runs AFTER the platoon
      # step so it isn't clobbered; a real MLB-confirmed lineup still supersedes.
      - name: Apply manual lineup overrides
        run: python scripts/apply_lineup_overrides.py
        continue-on-error: true

      - name: Refresh pitcher stats (overnight only)
        run: python scripts/refresh_pitcher_stats.py
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: Enrich pitcher_stats with xFIP / Stuff+ / Pitching+
        run: |
          python scripts/refresh_pitcher_stats_enrich.py data/pitcher_stats.json > /tmp/ps.json && mv /tmp/ps.json data/pitcher_stats.json || true
        continue-on-error: true

      - name: Enrich pitcher_stats with projected FIP (ATC / BatX / OOPSY / ZiPS)
        run: |
          python scripts/refresh_projections.py data/pitcher_stats.json > /tmp/ps.json && mv /tmp/ps.json data/pitcher_stats.json || true
        continue-on-error: true

      - name: Enrich pitcher_stats with FG Pitcher Bot ERA
        run: |
          python scripts/refresh_bot_era.py data/pitcher_stats.json > /tmp/ps.json && mv /tmp/ps.json data/pitcher_stats.json || true
        continue-on-error: true

      - name: Enrich pitcher_stats with Savant HR/9 / GB% / Whiff% / HH%
        run: |
          python scripts/refresh_pitcher_savant.py data/pitcher_stats.json > /tmp/ps.json && mv /tmp/ps.json data/pitcher_stats.json || true
        continue-on-error: true

      - name: Pull pitcher arsenal (Savant per-pitch-type stats)
        run: |
          python scripts/refresh_pitcher_arsenal.py > /tmp/pa.json && mv /tmp/pa.json data/pitcher_arsenal.json || true
        continue-on-error: true

      - name: Enrich hitters with projected OPS / K% / BB% / actual wOBA
        run: |
          python scripts/refresh_hitter_stats_enrich.py data/hitters.json > /tmp/h.json && mv /tmp/h.json data/hitters.json || true
        continue-on-error: true

      - name: Pull hitter Statcast percentile rankings
        run: |
          python scripts/refresh_hitter_percentiles.py > /tmp/hp.json && mv /tmp/hp.json data/hitter_percentiles.json || true
        continue-on-error: true

      # Re-apply unified scores after every overnight refresh.
      # refresh_pitcher_stats.py overwrites the whole `pitchers` map from a
      # fresh FG dump, dropping unified_score keys; same risk on hitters when
      # refresh_hitter_stats_enrich.py rewrites entries. These are cheap
      # in-place computes (no network) so just run them after every pass.
      - name: Compute unified pitcher score
        run: python scripts/compute_pitcher_score.py
        continue-on-error: true

      - name: Compute unified hitter score
        run: python scripts/compute_hitter_score.py
        continue-on-error: true

      - name: Snapshot pre-game model inputs (forward-backtest archive)
        # PREGAME_MODEL_SPEC.md decision 4: capture every input that feeds
        # computePregame() (SP RA, BP RA, n_fatigued, team offense, BSR/DEF,
        # park, pw/pqm/bp_factor + projected runs/WP/total) into
        # data/archive/{date}/pregame_inputs.json so we can backtest once a
        # couple weeks of snapshots stack up. Re-runs overwrite for the day
        # so the snapshot always reflects the latest lineup info.
        run: python scripts/refresh_pregame_archive.py
        continue-on-error: true

      - name: Snapshot per-pitcher anchors (xERA / botERA / proj / wFIP)
        # Freezes the season-cumulative anchor metrics each day. Future wFIP
        # weight backtests can read the date-stamped file matching their
        # prediction date instead of leaking the current snapshot's
        # forward-looking xERA / botERA / fip_proj values. Output:
        # data/archive/{date}/pitcher_anchors.json (~70 KB / day).
        run: python scripts/refresh_pitcher_anchors_archive.py
        continue-on-error: true

      - name: Refresh betting odds (ActionNetwork scrape)
        run: python scripts/refresh_odds.py
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: Scrape AN archive (prior day finalized odds + PRO where public)
        run: python scripts/scrape_action_archive.py --start yesterday --end yesterday
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: Capture CLV snapshot (today's PRO projection + opening line)
        # Action's PRO projection is only served pre-game, so snapshot it (plus
        # the Book-30 opener) into data/clv/{date}.json while games are pending.
        run: python scripts/capture_clv_snapshot.py
        continue-on-error: true

      - name: Compute CLV / directional grades (open -> close vs our number)
        run: python scripts/compute_clv.py
        continue-on-error: true

      - name: Import my Action PRO projections (GAME UPLOADER sheet -> sheet_projections.json)
        # Reads the published GAME UPLOADER tab CSV, maps game_id (AN event id)
        # -> gamePk, writes data/sheet_projections.json. Falls back to the public
        # published-CSV URL (the same one index.html reads in-browser) when the
        # SHEET_CSV_URL secret isn't set — this is a published-to-web link, not a
        # credential, so the snapshot stays fresh without needing the secret.
        run: |
          export SHEET_CSV_URL="${SHEET_CSV_URL:-https://docs.google.com/spreadsheets/d/e/2PACX-1vR8rC-5ro6T19a3W6mQDpwDrr5nK6supT0TVYATBk305OgcrlQqeCOlz8mPydvfEZ_XqYR96g7s816P/pub?gid=580753288&single=true&output=csv}"
          python scripts/refresh_sheet_projections.py
        continue-on-error: true
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}

      - name: Archive my sheet projections (daily snapshot of MY runs/totals)
        # data/sheet_projections.json is overwritten every run, so snapshot it
        # into the daily archive to build a per-day record of MY projected
        # runs/totals. Enables model-vs-market/actual backtests across the FULL
        # slate (not just the ~2/day CLV-tracked lean games). Overwrites the
        # day's copy each run so it converges to the final pre-game projection.
        # Only snapshot when the sheet actually has games — a run where the
        # published sheet returns 0 games must NOT clobber a good earlier copy.
        run: |
          python - <<'PY'
          import json, os, shutil, datetime as dt
          D = (dt.datetime.utcnow() - dt.timedelta(hours=4)).date().isoformat()
          os.makedirs(f"data/archive/{D}", exist_ok=True)
          src = "data/sheet_projections.json"; dst = f"data/archive/{D}/sheet_projections.json"
          try:
              d = json.load(open(src)); n = d.get("n_games") or len(d.get("games") or [])
          except Exception:
              n = 0
          if n > 0:
              shutil.copy(src, dst); print(f"archived {n} games -> {dst}")
          else:
              # keep any existing good snapshot; don't overwrite with an empty one
              print("sheet_projections has 0 games; skipping (won't clobber a good snapshot)")
          PY
        continue-on-error: true

      - name: Odds fallback - multi-source (BettingPros/VegasInsider/ScoresAndOdds)
        # Triggers if odds.json is missing, has no games, OR has yesterday's date.
        # Date-freshness check was added because ActionNetwork's API sometimes
        # blocks GitHub Actions runner IPs (Cloudflare 403), in which case
        # refresh_odds.py returns silently and odds.json keeps yesterday's
        # content. Without this check, the multi-source fallback would never
        # trigger because the file still has (stale) games in it.
        run: |
          if [ ! -s data/odds.json ] || ! python -c "import json, datetime as dt; d=json.load(open('data/odds.json')); today=(dt.datetime.utcnow()-dt.timedelta(hours=4)).date().isoformat(); exit(0 if (d.get('games') and any(g.get('moneyline',{}).get('away') for g in d['games']) and d.get('date')==today) else 1)" 2>/dev/null; then
            echo "Primary odds empty or stale - trying multi-source fallback"
            python scripts/refresh_odds_multi.py > data/odds.json || true
          fi
        continue-on-error: true

      - name: Odds fallback - The Odds API (if ODDS_API_KEY set and still empty)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -n "$ODDS_API_KEY" ] && { [ ! -s data/odds.json ] || ! python -c "import json, datetime as dt; d=json.load(open('data/odds.json')); today=(dt.datetime.utcnow()-dt.timedelta(hours=4)).date().isoformat(); exit(0 if (d.get('games') and any(g.get('moneyline',{}).get('away') for g in d['games']) and d.get('date')==today) else 1)" 2>/dev/null; }; then
            echo "Still empty or stale - using The Odds API"
            python scripts/refresh_odds_oddsapi.py > data/odds.json || true
          fi
        continue-on-error: true

      - name: Refresh park factors + BP daily weather
        run: python scripts/refresh_park_data.py
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: Refresh SP platoon splits + opener detection
        run: python scripts/refresh_splits.py
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: BARTOLO train GBM (gated on .train-now file)
        if: hashFiles('.train-now') != ''
        timeout-minutes: 30
        run: |
          python scripts/bartolo_train.py
          rm -f .train-now
        continue-on-error: true

      - name: BARTOLO backfill historical sims (gated on .backfill-now file)
        if: hashFiles('.backfill-now') != ''
        timeout-minutes: 60
        run: |
          python scripts/bartolo_backfill.py
        continue-on-error: true
        env:
          BACKFILL_START: ${{ github.event.inputs.backfill_start || '' }}
          BACKFILL_END:   ${{ github.event.inputs.backfill_end   || '' }}
          BACKFILL_FORCE: ${{ github.event.inputs.backfill_force || '' }}

      - name: BARTOLO daily WP sim (gated on model pickle)
        run: python scripts/bartolo_daily.py
        continue-on-error: true
        env:
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}

      - name: BARTOLO backtest (reads archive; pure local)
        run: python scripts/bartolo_backtest.py
        continue-on-error: true

      - name: Refresh league-wide team grades (30 teams, fixed reference)
        # Statcast team-avg view used to z-score grades against teams in the
        # current slate, so a 2-game day gave bizarrely different grades than
        # a 14-game day. This script computes each team's category averages
        # once across the full league and stores fixed mean/SD references so
        # the frontend can grade deterministically.
        run: python scripts/refresh_team_grades.py
        continue-on-error: true

      - name: Pre-game backtest aggregate (joins pregame snapshots → actuals)
        # Reads every data/archive/{date}/pregame_inputs.json and joins by
        # game_pk → bartolo_wp finals. Outputs data/pregame_backtest.json
        # with per-game model-vs-actual rows + headline calibration stats
        # (total MAE, WP Brier, fav-cover %, calibration buckets).
        # Pre-game snapshots start landing 2026-05-30 (see refresh_pregame_archive.py).
        run: python scripts/refresh_pregame_backtest.py
        continue-on-error: true

      - name: Aggregate season luck ratings (Off + Def + QoC + Ump)
        # Walks data/archive/{date}/bartolo_wp.json across the season and
        # produces data/luck_ratings.json — per-team net luck (actual vs
        # deserved runs), xwOBA QoC differential, and cumulative ump favor.
        # Powers the Luck Ratings tab. Pure local read; trivial runtime.
        run: python scripts/refresh_luck_ratings.py
        continue-on-error: true

      - name: Refresh Power+Eye sources (Savant EV + Swing/Take, FG cache)
        # Pulls fresh Savant Exit Velocity + Swing/Take per-hitter values and
        # writes data/power_eye_2026.csv. FanGraphs plate discipline is
        # Cloudflare-protected — falls back to the existing data/fg_plate_disc_2026.csv
        # cache for the O-Swing/Z-Swing/SwStr/Zone inputs (refresh that file
        # manually via the admin browser bookmarklet when needed).
        run: python scripts/refresh_power_eye.py
        continue-on-error: true

      - name: Rebuild grades_v2.json (PWR/EYE/DEF/BSR letter grades)
        # Reads data/power_eye_2026.csv + data/def_bsr_2026.csv, applies the
        # user's Orr-equivalent Power+Eye formulas + the FLD/BSR model output,
        # rank-percentiles each metric, then maps through the A+→D- ladder.
        # Writes data/grades_v2.json — single source the frontend reads.
        run: python scripts/build_grades_v2.py
        continue-on-error: true

      - name: Build sheet sync feed (weather % + HP ump per Action Network GameID)
        # Emits data/sheet_sync.json — the pre-joined feed the projection-model
        # Google Sheet pulls (Apps Script checkbox) to overwrite each matchup's
        # weather % (col J, header+3) and HP umpire name (col J, header+5),
        # matched on the AN event id stored in the model's "GameID" column.
        # Reuses data/weather.json + live AN/MLB officials (posted, else the
        # crew-rotation projection the tool uses; de-accented).
        run: python scripts/build_sheet_sync.py
        continue-on-error: true

      - name: Log weather calibration (model vs BallparkPal, per game)
        # Upserts one row per game into data/weather_calibration_log.csv each
        # refresh — pure model_pct, headline run_adj_pct, BP bp_pct + inputs +
        # v8 component breakdown. Accumulates the sample needed to recalibrate
        # TEMP_C / wind / per-park terms against BP (and later actual runs).
        run: python scripts/log_weather_calibration.py
        continue-on-error: true

      - name: Commit changed data (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ scripts/ || true
          [ -f scripts/bartolo/bartolo_model.pkl ] && git add scripts/bartolo/bartolo_model.pkl || true
          [ -d data/archive ] && git add data/archive || true
          git add -u .train-now 2>/dev/null || true
          git add -u .backfill-now 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Data refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            # Push with rebase-on-reject retry. The refresh cron runs every 15
            # min during game hours and frequently races with other scheduled
            # workflows (pitcher_data, weather, team_futures, manual dispatches).
            # Without this, a single concurrent push fails the whole run and
            # the data sits uncommitted until the next 15-min slot.
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push attempt $attempt rejected; rebasing onto origin/main"
              git fetch origin main
              git rebase --autostash origin/main || { git rebase --abort; exit 1; }
            done
          fi
