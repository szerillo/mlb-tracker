name: kalshi-prop-orderbook-log
on:
  schedule:
    - cron: '*/20 14-23,0-3 * * *'   # every 20 min, 10 AM to 11:59 PM ET
  workflow_dispatch:
permissions:
  contents: write
# prop scan + order-book job both write data/prop_scan: run one at a time (queued, never cancelled)
concurrency:
  group: bartolo-prop-data
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/kalshi_oblog_once.py
      - run: python3 scripts/an_props_log_once.py
      - name: game lines (Pinnacle, Action Network, Kalshi game markets + $1k prints)
        run: python3 scripts/game_lines_log.py || true
      - name: sides board (scoreboard open-window badges, lag rule, paper bets) + archive + closes
        run: python3 scripts/sides_board.py || true
      - name: grade sides board
        run: python3 scripts/sides_grade.py || true
      - name: archive Sharp Props board (includes the lag rule in Leads) + freeze closes
        env: {SCAN_DIR: data/prop_scan}
        run: python3 scripts/props_board_archive.py || true
      - name: paper bet tracker
        run: python3 scripts/build_bet_tracker.py || true
      - run: |
          git config user.name "oblog-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/kalshi_oblog data/an_props_log data/prop_scan data/game_lines data/bet_tracker.json && git commit -m "kalshi orderbook snapshot + props/sides boards" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
