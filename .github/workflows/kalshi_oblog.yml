name: kalshi-prop-orderbook-log
on:
  schedule:
    - cron: '*/20 14-23,0-3 * * *'   # every 20 min, 10 AM to 11:59 PM ET
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/kalshi_oblog_once.py
      - run: python3 scripts/an_props_log_once.py
      - name: archive dashboard board + freeze closes (last 30 min before first pitch)
        env: {SCAN_DIR: data/prop_scan}
        run: python3 scripts/props_board_archive.py || true
      - name: game lines (Pinnacle, Action Network, Kalshi game markets + $1k prints)
        run: python3 scripts/game_lines_log.py || true
      - name: Sharp Sides & Totals board + archive + closes
        run: python3 scripts/sides_board.py || true
      - name: grade sides board
        run: python3 scripts/sides_grade.py || true
      - run: |
          git config user.name "oblog-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/kalshi_oblog data/an_props_log data/prop_scan data/game_lines && git commit -m "kalshi orderbook snapshot + props/sides boards" || exit 0
          git pull --rebase && git push
