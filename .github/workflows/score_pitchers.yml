name: Score pitchers (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compute unified pitcher score (backfills from gamelogs)
        run: python scripts/compute_pitcher_score.py

      - name: Commit pitcher_stats (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pitcher_stats.json data/wfip_lookup.json
          git diff --cached --quiet || git commit -m "Re-score pitchers (backfill from gamelogs)"
          git push
