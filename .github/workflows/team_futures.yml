name: Team Futures (daily)

# Daily aggregation of team-level projections + futures odds. Lands a single
# data/team_futures.json that the Futures tab reads. Odds are scraped from
# VegasInsider; projections come from PECOTA (BP) + FG 4-mode ROS DC.
#
# Cadence: 3 morning probes (8 / 9 / 10:30 AM ET) so we can compare
# generated_at timestamps and figure out when VI actually refreshes its
# lines, plus an evening pull. Once we know VI's update minute we'll narrow
# back to a single morning slot.

on:
  schedule:
    # 12:00 UTC = 8:00 AM ET (EDT) — earliest morning probe
    - cron: "0 12 * * *"
    # 13:00 UTC = 9:00 AM ET — second probe
    - cron: "0 13 * * *"
    # 14:30 UTC = 10:30 AM ET — third probe (was 10:45 previously)
    - cron: "30 14 * * *"
    # 22:30 UTC = 6:30 PM ET — evening pull for end-of-day odds movement
    - cron: "30 22 * * *"
  workflow_dispatch:

concurrency:
  group: team-futures
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  futures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Refresh team projections (PECOTA + FG 4 modes)
        run: python scripts/refresh_team_projections.py
        continue-on-error: true

      - name: Refresh team futures odds (VegasInsider)
        run: python scripts/refresh_team_futures_odds.py

      - name: Refresh win totals + playoff Y/N from BettingPros consensus
        run: python scripts/refresh_team_futures_bp.py
        continue-on-error: true

      - name: Compute sean team projections (player-data ROS + playoff sim)
        run: python scripts/compute_sean_team_projections.py
        continue-on-error: true

      # DISABLED for October (2026-09-28): the lane-2 feeds (lane2_marginalized/series/
      # grid/team_proj.json) are hand-maintained STATIC v4 output, priced off the live
      # sheet by Fable and transformed via build_lane2_from_v4.py. The repo offense feed
      # (batter_projected.json) is ~10% light + per-player platoon, so run_lane2_bracket
      # here does NOT reproduce the validated v4 numbers and would clobber them. Re-enable
      # once batter_projected is rebuilt to the sheet (durable fix). Live in-round updates
      # still run via refresh_series_live in odds_refresh.yml (reads the static grid).
      # - name: Price lane-2 native game-sim bracket
      #   run: python scripts/run_lane2_bracket.py
      #   continue-on-error: true

      - name: Refresh series market odds (best price across books)
        run: python scripts/refresh_series_odds.py
        continue-on-error: true

      - name: Compute team futures aggregate
        run: python scripts/compute_team_futures.py
        continue-on-error: true

      - name: Commit changed data (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team_projections.json data/team_futures_odds.json data/team_no_playoff_odds.json data/team_futures.json data/sean_team_projections.json data/series_odds.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Team futures refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            # Race-proof push (rebase + retry once if main moved during our run)
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push failed, rebasing and retrying (attempt $i)…"
              git pull --rebase --autostash || true
            done
          fi

      - name: FanGraphs snapshot freshness check
        if: always()
        run: python scripts/check_fg_freshness.py
