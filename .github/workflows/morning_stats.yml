name: Morning stats refresh (FG + Savant)

# The once-a-day season-stat pull (FanGraphs + Baseball Savant): pitcher stats +
# enrichments, hitter percentiles, park factors, splits, grades. These only
# change once per day (settled overnight), so they do NOT belong in the 15-min
# live refresh.
#
# TIMING BAKE-OFF (temporary): 8 AM provisional + 10/11 AM ET settled window. Each
# run appends a fingerprint (coverage counts + value-hashes) to
# data/stats_timing_log.csv. When a source's hash is identical across hours on
# the same day, it was already settled by the earlier hour. After a few days,
# run `python scripts/log_stats_timing.py --report` and drop the cron to the
# single earliest safe hour.

on:
  workflow_dispatch:
  schedule:
    # 8, 10, 11 AM ET  (EDT = UTC-4)  -> 12,14,15 UTC   (8=provisional, 10+11=settled window/probe)
    - cron: "0 12,14,15 * * *"

concurrency:
  group: morning-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  morning-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests beautifulsoup4 unidecode pandas numpy pyarrow pybaseball scikit-learn

      # ---- FanGraphs pitcher stats + enrichments ----
      - name: Refresh pitcher stats (FG)
        run: python scripts/refresh_pitcher_stats.py
        env: { FORCE_RUN: "1" }
        continue-on-error: true
      - name: Enrich xFIP / Stuff+ / Pitching+
        run: python scripts/refresh_pitcher_stats_enrich.py data/pitcher_stats.json > /tmp/ps.json && mv /tmp/ps.json data/pitcher_stats.json || true
        continue-on-error: true
      - name: Enrich projected FIP (ATC/BatX/OOPSY/ZiPS)
        run: python scripts/refresh_projections.py data/pitcher_stats.json > /tmp/ps.json && mv /tmp/ps.json data/pitcher_stats.json || true
        continue-on-error: true
      - name: Enrich FG Pitcher Bot ERA
        run: python scripts/refresh_bot_era.py data/pitcher_stats.json > /tmp/ps.json && mv /tmp/ps.json data/pitcher_stats.json || true
        continue-on-error: true
      - name: Enrich Savant HR/9 / GB% / Whiff% / HH%
        run: python scripts/refresh_pitcher_savant.py data/pitcher_stats.json > /tmp/ps.json && mv /tmp/ps.json data/pitcher_stats.json || true
        continue-on-error: true
      - name: Pull pitcher arsenal (Savant)
        run: python scripts/refresh_pitcher_arsenal.py > /tmp/pa.json && mv /tmp/pa.json data/pitcher_arsenal.json || true
        continue-on-error: true

      # ---- Hitter stats (FG enrich + Savant percentiles) ----
      - name: Enrich hitters (projected OPS/K%/BB%/wOBA)
        run: python scripts/refresh_hitter_stats_enrich.py data/hitters.json > /tmp/h.json && mv /tmp/h.json data/hitters.json || true
        continue-on-error: true
      - name: Pull hitter Statcast percentiles
        run: python scripts/refresh_hitter_percentiles.py > /tmp/hp.json && mv /tmp/hp.json data/hitter_percentiles.json || true
        continue-on-error: true

      # ---- Unified scores (cheap local recompute after the pulls) ----
      - name: Compute unified pitcher score
        run: python scripts/compute_pitcher_score.py
        continue-on-error: true
      - name: Compute unified hitter score
        run: python scripts/compute_hitter_score.py
        continue-on-error: true

      # ---- Park / splits / grades ----
      - name: Refresh park factors + BP daily weather
        run: python scripts/refresh_park_data.py
        env: { FORCE_RUN: "1" }
        continue-on-error: true
      - name: Refresh SP platoon splits + opener detection
        run: python scripts/refresh_splits.py
        env: { FORCE_RUN: "1" }
        continue-on-error: true
      - name: Refresh league-wide team grades
        run: python scripts/refresh_team_grades.py
        continue-on-error: true
      - name: Refresh Power+Eye sources (Savant EV + Swing/Take)
        run: python scripts/refresh_power_eye.py
        continue-on-error: true
      - name: Rebuild grades_v2.json
        run: python scripts/build_grades_v2.py
        continue-on-error: true
      - name: Rebuild hitter vR/vL splits
        run: python scripts/refresh_hitter_splits.py
        continue-on-error: true

      # ---- STAFF_OFF_v2 offense projection (Savant true xwOBA -> blend -> staff_offense.json) ----
      - name: Refresh Savant true xwOBA (est_woba)
        run: python scripts/refresh_savant_xwoba.py
        continue-on-error: true
      - name: Compute STAFF_OFF_v2 offense projections
        run: python scripts/compute_staff_offense.py
        continue-on-error: true

      # ---- Timing fingerprint (the bake-off logger) ----
      - name: Log stats-timing fingerprint
        run: python scripts/log_stats_timing.py
        continue-on-error: true

      - name: Commit changed data (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ || true
          git add -f hitter_splits.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Morning stats refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push attempt $attempt rejected; rebasing onto origin/main"
              git fetch origin main
              git rebase -X theirs --autostash origin/main || { git rebase --abort; exit 1; }
            done
          fi
