name: Model grades (vs close)

# Grade OUR numbers (sheet_projections) against the market close + result for
# every game, every day, and split out the bettable (>=3% edge) subset at
# midnight ET and at close. Standalone so it never touches the main refresh.
#
#   - capture_midnight_snapshot.py freezes our number + the market line at the
#     first run inside the midnight-ET window (write-once per slate).
#   - grade_model.py re-grades every date that has our number + a finalized
#     close, writing data/model_grades/{date}.json + data/model_grades_summary.json.
#   - backtest_additive.py grades the SP-response slope (is the additive/more-SP
#     -weight justified) + model-vs-results + model-vs-close over the full
#     archive window, writing data/additive_backtest.json.
#
# Reads the data the refresh workflow already commits (sheet_projections.json,
# odds.json, data/archive/*, data/odds_archive/*), so it just needs a checkout.

on:
  schedule:
    - cron: "10 4 * * *"    # 00:10 AM ET - freeze the midnight snapshot
    - cron: "10 5 * * *"    # 01:10 AM ET - redundant midnight catch (write-once)
    - cron: "0 16 * * *"    # 12:00 PM ET - grade prior slates (finals are in)
  workflow_dispatch:

concurrency:
  group: model-grades
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Freeze midnight snapshot (self-gates to 00:xx-05:xx ET, write-once)
        run: python scripts/capture_midnight_snapshot.py
        continue-on-error: true

      - name: Grade model vs close (all games + bettable subset)
        run: python scripts/grade_model.py
        continue-on-error: true

      - name: Additive backtest (SP-slope + vs results + vs close)
        run: |
          pip install --quiet numpy
          python scripts/backtest_additive.py
        continue-on-error: true

      - name: Commit changed grades (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/model_grades data/model_grades_summary.json data/additive_backtest.json data/archive 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Model grades $(date -u +'%Y-%m-%dT%H:%MZ')"
            for i in 1 2 3; do
              if git push; then break; fi
              echo "push failed, rebasing and retrying (attempt $i)..."
              git pull --rebase --autostash || true
            done
          fi
