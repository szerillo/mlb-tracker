name: Odds + projections refresh (frequent)

# Reliable ~5-min odds cadence via an INTERNAL LOOP. GitHub throttles scheduled
# crons hard (observed 20 min - 5 h between */5 fires on this repo), so a single
# run loops for ~12 min refreshing every 5 min, and a 15-min heartbeat cron
# restarts it. Game-awareness + freeze-at-first-pitch live in refresh_odds.py, so
# out-of-window passes are cheap no-ops and started games stay frozen at their
# closing pregame line. Kalshi prediction-market prices refresh on the same loop.
# Times are ET (EDT, UTC-4); GitHub cron is UTC.

on:
  schedule:
    - cron: "*/15 11-23 * * *"   # 7 AM - 7:59 PM ET
    - cron: "*/15 0-6 * * *"     # 8 PM - 2:59 AM ET
  workflow_dispatch:

concurrency:
  group: odds-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      # Force a pull only on manual dispatch; scheduled runs stay game-aware.
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
      SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      SHEET_F5_CSV_URL: ${{ secrets.SHEET_F5_CSV_URL }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Sweep - refresh odds + Kalshi every 5 min for ~12 min
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$(( $(date +%s) + 12*60 ))
          pass=0
          while : ; do
            pass=$((pass+1))
            echo "::group::sweep pass $pass ($(date -u +%H:%M:%SZ))"
            git pull --rebase --autostash origin main || true
            python scripts/refresh_odds.py || true
            if [ ! -s data/odds.json ]; then
              echo "primary odds empty -> multi-source fallback"
              python scripts/refresh_odds_multi.py > data/odds.json || true
            fi
            python scripts/refresh_f5_odds.py || true
            python scripts/refresh_sheet_projections.py || true
            python scripts/refresh_f5_projections.py || true
            python scripts/refresh_kalshi.py || true
            git add -A data || true
            if git diff --cached --quiet ; then
              echo "no changes this pass"
            else
              git commit -m "Odds/Kalshi sweep $(date -u +%H:%MZ)" || true
              git push || { git pull --rebase --autostash origin main || true; git push || true; }
              echo "pushed"
            fi
            echo "::endgroup::"
            [ "$(date +%s)" -ge "$END" ] && break
            sleep 300
          done
