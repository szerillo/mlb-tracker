name: Odds refresh (frequent)

# Lightweight, odds-ONLY refresh that runs far more often than the full data
# pipeline. The main refresh.yml only does odds every 15 min midday and drops to
# hourly after 8 PM ET — exactly when evening lines move most. This runs every
# 5 min across pregame + game hours so odds stay fresh. refresh_odds.py
# self-gates on within_game_window (4h before → 5h after a game) + overnight
# anchors, so slots with no nearby game are cheap no-ops.

on:
  schedule:
    - cron: "*/5 15-23 * * *"   # 11 AM – 7:45 PM ET, every 5 min
    - cron: "*/5 0-6 * * *"     # 8 PM – 2 AM ET, every 5 min
  workflow_dispatch:

# Don't pile up overlapping runs; let an in-flight commit finish rather than
# cancel it mid-push.
concurrency:
  group: odds-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # refresh_odds.py is pure stdlib; bs4/requests only for the multi-source
      # fallback parser. Cached, ~10s.
      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Refresh betting odds (ActionNetwork)
        run: python scripts/refresh_odds.py
        continue-on-error: true

      - name: Odds fallback — multi-source (if primary empty or stale)
        # Same guard the main pipeline uses: only override when odds.json is
        # missing, has no priced games, or is still on yesterday's date.
        run: |
          if [ ! -s data/odds.json ] || ! python -c "import json, datetime as dt; d=json.load(open('data/odds.json')); today=(dt.datetime.utcnow()-dt.timedelta(hours=4)).date().isoformat(); exit(0 if (d.get('games') and any(g.get('moneyline',{}).get('away') for g in d['games']) and d.get('date')==today) else 1)" 2>/dev/null; then
            echo "Primary odds empty or stale — trying multi-source fallback"
            python scripts/refresh_odds_multi.py > data/odds.json || true
          fi
        continue-on-error: true

      - name: Commit odds (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json || true
          if git diff --cached --quiet; then
            echo "No odds change."
          else
            git commit -m "Odds refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            # Rebase-on-reject retry — this races with the main refresh.yml
            # commit; reconcile rather than fail.
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push attempt $attempt rejected; rebasing onto origin/main"
              git fetch origin main
              git rebase --autostash origin/main || { git rebase --abort; exit 1; }
            done
          fi
