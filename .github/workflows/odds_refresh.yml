name: Odds refresh (frequent)

# Odds-ONLY refresh, decoupled from the heavy data pipeline. GAME-AWARE: the
# cron fires every 5 min across the active day, but refresh_odds.py only actually
# fetches when a game is within its window (~4h before first pitch → 5h after) OR
# at the overnight anchors (12 AM / 2 AM / 8 AM ET, for next-day line snapshots).
# So it auto-tightens to a 5-min cadence whenever ANY game — day or night — is
# live or near, and self-skips when nothing's happening (no wasted API calls).
#
# No FORCE_RUN on scheduled fires (that's what makes it game-aware). A manual
# "Run workflow" forces a pull regardless.
#
# Times are ET (EDT, UTC-4); GitHub cron is UTC (~1h seasonal drift, same as
# refresh.yml).

on:
  schedule:
    - cron: "*/5 11-23 * * *"   # 7 AM – 7:59 PM ET
    - cron: "*/5 0-6 * * *"     # 8 PM – 2:59 AM ET
  workflow_dispatch:

concurrency:
  group: odds-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    env:
      # Force only on manual dispatch; scheduled runs stay game-aware.
      FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # refresh_odds.py is pure stdlib; bs4/requests only for the fallback parser.
      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Refresh betting odds (ActionNetwork)
        run: python scripts/refresh_odds.py
        continue-on-error: true

      - name: Odds fallback (force primary if stale; secondary sources never overwrite with an empty payload)
        run: python scripts/odds_fallback.py
        continue-on-error: true

      - name: Live series probabilities (conditional on in-round score + auto round-advance)
        # Reads data/lane2_grid.json (all-matchups grid from run_lane2_bracket) + live
        # statsapi scores; rewrites data/lane2_series.json with current-round, conditional
        # win%. Pass-through (no change) before any postseason game finals.
        run: python scripts/refresh_series_live.py
        continue-on-error: true

      - name: Playoff Fit (v2) live re-price (conditional on postseason results)
        # Same frozen v2 engine as run_v2_bracket.py, on the actual seeded bracket, with
        # every started series priced from its current score. Rewrites data/v2_marginalized.json.
        run: |
          pip install -q numpy pandas scipy
          snap='import json;d=json.load(open("data/v2_marginalized.json"));print(d.get("ws"),d.get("reach_ds"))'
          before=$(python -c "$snap" 2>/dev/null)
          python scripts/v2/v2_live.py
          after=$(python -c "$snap" 2>/dev/null)
          # A game went final (bracket odds moved): rebuild the Composite now, not tomorrow.
          # FORCE_RUN bypasses compute_team_futures' once-a-day guard. Uses whatever FG/PECOTA
          # snapshot is in data/ (those refresh via the Chrome pull / morning run).
          if [ "$before" != "$after" ]; then
            FORCE_RUN=1 python scripts/compute_team_futures.py || true
          fi
        continue-on-error: true

      - name: Refresh series market odds (best price across books)
        run: python scripts/refresh_series_odds.py
        continue-on-error: true

      - name: Commit odds (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json data/lane2_series.json data/lane2_marginalized.json data/v2_marginalized.json data/team_futures.json data/series_odds.json || true
          if git diff --cached --quiet; then
            echo "No odds change."
          else
            git commit -m "Odds refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push attempt $attempt rejected; rebasing onto origin/main"
              git fetch origin main
              git rebase --autostash origin/main || { git rebase --abort; exit 1; }
            done
          fi
