name: Odds refresh (frequent)

# Odds-ONLY refresh, decoupled from the heavy data pipeline so lines can update
# on a tight cadence. Times below are ET (EDT, UTC-4); GitHub cron is UTC, so
# there's a ~1h seasonal drift in winter (same convention as refresh.yml).
#
# Cadence (ET):
#   • 12 AM           — next-day pull
#   • 1 AM – 7 AM     — hourly
#   • 8 AM – 3 PM     — every 20 min (lines posting / day-game lineups)
#   • 3 PM – 10 PM    — every 5 min (lineups setting + games live)
#   • 10 PM           — one pull for the following day
#
# FORCE_RUN=1 is set so the script fetches on every scheduled fire instead of
# self-skipping when no game is within its ~4h window (otherwise the morning and
# overnight pulls would no-op).

on:
  schedule:
    - cron: "0 4 * * *"          # 12 AM ET — next-day pull
    - cron: "0 5-11 * * *"       # 1 AM – 7 AM ET — hourly
    - cron: "*/20 12-18 * * *"   # 8 AM – 2:59 PM ET — every 20 min
    - cron: "*/5 19-23 * * *"    # 3 PM – 7:59 PM ET — every 5 min
    - cron: "*/5 0-1 * * *"      # 8 PM – 9:59 PM ET — every 5 min
    - cron: "0 2 * * *"          # 10 PM ET — one pull for the following day
  workflow_dispatch:

concurrency:
  group: odds-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  odds:
    runs-on: ubuntu-latest
    env:
      FORCE_RUN: "1"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # refresh_odds.py is pure stdlib; bs4/requests only for the fallback parser.
      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Refresh betting odds (ActionNetwork)
        run: python scripts/refresh_odds.py
        continue-on-error: true

      - name: Odds fallback — multi-source (if primary empty or stale)
        run: |
          if [ ! -s data/odds.json ] || ! python -c "import json, datetime as dt; d=json.load(open('data/odds.json')); today=(dt.datetime.utcnow()-dt.timedelta(hours=4)).date().isoformat(); exit(0 if (d.get('games') and any(g.get('moneyline',{}).get('away') for g in d['games']) and d.get('date')==today) else 1)" 2>/dev/null; then
            echo "Primary odds empty or stale — trying multi-source fallback"
            python scripts/refresh_odds_multi.py > data/odds.json || true
          fi
        continue-on-error: true

      - name: Commit odds (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json || true
          if git diff --cached --quiet; then
            echo "No odds change."
          else
            git commit -m "Odds refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push attempt $attempt rejected; rebasing onto origin/main"
              git fetch origin main
              git rebase --autostash origin/main || { git rebase --abort; exit 1; }
            done
          fi
