name: Env Tracker Refresh

on:
  schedule:
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: env-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pybaseball pandas numpy
      - name: Build env_tracker.json
        run: python scripts/refresh_env_tracker.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/env_tracker.json
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "Env tracker refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && break || sleep 5
          done
