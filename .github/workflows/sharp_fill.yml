name: "sharp-tracker: log a fill"
# Writes one row to the bet ledger (data/sharp/fills.jsonl) with the fair at this moment, computed from a fresh fold of the logs.
# Run it right after you place the bet. A row written after first pitch is kept but tagged late and excluded from CLV.
on:
  workflow_dispatch:
    inputs:
      game:   {description: 'AWAY@HOME, e.g. MIL@LAD (nearest upcoming game)', required: true}
      market: {description: 'ml rl total tt_home tt_away f5_ml f5_rl f5_total rfi prop_K prop_OUTS prop_HA prop_BBA prop_ER prop_H prop_TB prop_HR prop_RBI prop_R prop_HRR prop_BK prop_BBB', required: true}
      side:   {description: 'home away over under', required: true, type: choice, options: [home, away, over, under]}
      line:   {description: 'line (blank for ML)', required: false}
      player: {description: 'player name for props', required: false}
      venue:  {description: 'Pinnacle Kalshi Novig DK FD Caesars BetRivers Fanatics theScore', required: true}
      price:  {description: 'American odds actually taken (Kalshi: what the ticket cost incl. fee)', required: true}
      stake:  {description: 'units risked', required: true, default: '1'}
      tag:    {description: 'rule / reason tag (written now, never later)', required: true}
      note:   {description: 'optional note', required: false}
permissions:
  contents: write
concurrency:
  group: sharp-tracker
  cancel-in-progress: false
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 sharp/build_db.py
      - name: write the fill
        run: |
          python3 -m sharp.fills add --game "${{ inputs.game }}" --market "${{ inputs.market }}" --side "${{ inputs.side }}" \
            ${{ inputs.line && format('--line {0}', inputs.line) || '' }} ${{ inputs.player && format('--player "{0}"', inputs.player) || '' }} \
            --venue "${{ inputs.venue }}" --price ${{ inputs.price }} --stake ${{ inputs.stake }} --tag "${{ inputs.tag }}" \
            ${{ inputs.note && format('--note "{0}"', inputs.note) || '' }}
      - run: python3 -m sharp.fills grade && python3 sharp/export.py
      - name: commit
        run: |
          git config user.name "sharp-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/sharp/fills.jsonl data/sharp/dashboard.json data/sharp/schedule_cache.json data/sharp/kalshi_markets.json
          git commit -m "fill: ${{ inputs.game }} ${{ inputs.market }} ${{ inputs.side }} @ ${{ inputs.venue }}" || exit 0
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
