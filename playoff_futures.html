<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARTOLO — Playoff Futures</title>
<style>
  :root{ --bg:#0a0e13; --panel:#141a22; --panel2:#1b232d; --border:#243240; --text:#e6edf3;
         --muted:#8b98a5; --accent:#5eead4; --good:#6fdc7e; --bad:#ff8f8f; --al:#4aa3ff; --nl:#ff6f6f;
         --fillA:#12313a; --fillB:#1d5c5a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif;
       padding:14px;max-width:900px;margin:0 auto}
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  h1{font-size:1.12rem;margin:0;font-weight:800;letter-spacing:.2px}
  .as{color:var(--muted);font-size:.74rem}
  .tabs{display:flex;gap:4px;margin:6px 0 4px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tabbtn{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
          font-weight:700;font-size:.85rem;padding:8px 12px;margin-bottom:-1px;cursor:pointer;font-family:inherit}
  .tabbtn.active{color:var(--text);border-bottom-color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:8px 0 4px}
  .seg button{background:none;border:0;color:var(--muted);font-weight:700;font-size:.74rem;padding:6px 13px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--panel2);color:var(--text)}
  .seg button+button{border-left:1px solid var(--border)}
  .sub{color:var(--muted);font-size:.75rem;margin:6px 2px 12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:680px){ .grid{grid-template-columns:1fr} }
  .lg{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .lghd{display:flex;align-items:center;gap:7px;padding:8px 11px;font-weight:800;font-size:.8rem;
        text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
  .lghd.al{color:var(--al)} .lghd.nl{color:var(--nl)}
  .lghd .mk{color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;font-size:.72rem;margin-left:2px}
  .dot{width:8px;height:8px;border-radius:50%} .dot.al{background:var(--al)} .dot.nl{background:var(--nl)}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:5px 6px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;padding-left:10px}
  thead th{color:var(--muted);font-size:.6rem;text-transform:uppercase;letter-spacing:.03em;
           font-weight:800;cursor:pointer;user-select:none;padding-top:7px;padding-bottom:7px}
  thead th.on{color:var(--accent)}
  thead th .ar{font-size:.55rem;opacity:.8;margin-left:1px}
  tbody tr{border-top:1px solid #1a2330}
  tbody tr:hover{background:#101720}
  .tm{display:flex;align-items:center;gap:7px;font-weight:700;font-size:.82rem}
  .tm img{width:19px;height:19px;object-fit:contain;flex:0 0 19px}
  td.b{position:relative}
  td.b .fill{position:absolute;left:0;top:3px;bottom:3px;background:linear-gradient(90deg,var(--fillA),var(--fillB));
             opacity:.55;border-radius:3px;z-index:0}
  td.b .v{position:relative;z-index:1;font-size:.8rem;font-weight:600}
  td.b.ws .v{color:var(--good);font-weight:800}
  td.b.na .v{color:#41505f}
  td.b.bye .v{color:var(--muted);font-weight:800;font-size:.66rem;letter-spacing:.08em}
  /* Edges tab stacked cell (Team Futures style): fair/listed odds on top, % muted below */
  td.mkc{vertical-align:top;line-height:1.15;font-weight:600}
  td.mkc .p{font-size:.82rem;font-weight:700;color:var(--text)}
  td.mkc .fo{font-size:.68rem;color:var(--muted);font-weight:600;margin-top:1px}
  td.mkc.mkt .p{color:var(--muted)}
  td.mkc .p.pos{color:var(--good)} td.mkc .p.neg{color:var(--bad)} td.mkc .p.flat{color:var(--text)}
  td.mkc .p .star{color:var(--accent);font-size:.58rem;letter-spacing:-1px;font-weight:700}
  /* Edges tab flat columns (Playoff-Picture style): one number per labeled column */
  td.mut{color:var(--muted);font-weight:600;font-size:.8rem}
  td.mdl{color:var(--text);font-weight:700;font-size:.82rem}
  td.edg{font-weight:800;font-size:.82rem}
  td.edg.pos{color:var(--good)} td.edg.neg{color:var(--bad)} td.edg.flat{color:var(--muted)}
  td.edg .star{color:var(--accent);font-size:.6rem;letter-spacing:-1px;font-weight:700;margin-left:2px}
  .segwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 4px}
  .segwrap .seg{margin:0}
  .seglab{color:var(--muted);font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-right:-3px}
  .dash{color:#3a4854}
  .foot{color:var(--muted);font-size:.7rem;margin-top:11px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .err{padding:16px;color:#ff8f8f}
</style>
</head>
<body>
  <div class="head">
    <h1>2026 Playoff Futures</h1>
    <span class="as" id="asof"></span>
  </div>
  <div class="tabs">
    <button class="tabbtn active" data-tab="proj">Projections</button>
    <button class="tabbtn" data-tab="edges">Edges</button>
  </div>
  <div id="seg"></div>
  <div class="sub" id="srcnote"></div>
  <div class="grid" id="roundGrid">
    <div class="lg"><div class="lghd al"><span class="dot al"></span>American League</div>
      <table data-lg="AL"><thead></thead><tbody></tbody></table></div>
    <div class="lg"><div class="lghd nl"><span class="dot nl"></span>National League</div>
      <table data-lg="NL"><thead></thead><tbody></tbody></table></div>
  </div>
  <div id="mktWrap" style="display:none"></div>
  <div class="foot">
    <span id="cnt"></span>
    <span id="footnote"></span>
  </div>
<script>
const RAW=(location.protocol==='file:'?'https://raw.githubusercontent.com/szerillo/mlb-tracker/main/data/':'data/');
const LOGO=ab=>'https://a.espncdn.com/i/teamlogos/mlb/500/'+({CWS:'chw',ATH:'ath',WSH:'wsh'}[ab]||ab.toLowerCase())+'.png';
const LEAGUE={NYY:'AL',BOS:'AL',TOR:'AL',TB:'AL',BAL:'AL',CLE:'AL',MIN:'AL',DET:'AL',KC:'AL',CWS:'AL',
 HOU:'AL',SEA:'AL',TEX:'AL',LAA:'AL',ATH:'AL',ATL:'NL',NYM:'NL',PHI:'NL',WSH:'NL',MIA:'NL',MIL:'NL',
 CHC:'NL',CIN:'NL',STL:'NL',PIT:'NL',LAD:'NL',SD:'NL',SF:'NL',ARI:'NL',COL:'NL'};
const COLS=[
 {k:'reach_ds_pct',lab:'WC'},
 {k:'reach_cs_pct',lab:'LDS'},
 {k:'ws_app_pct',  lab:'Pennant'},
 {k:'ws_pct',      lab:'WS', ws:true},
];
const MKTS=[
 {key:'pennant', lab:'Pennant', model:'ws_app_pct', mkt:'pennant_implied_pct', odds:'pennant_odds'},
 {key:'ws',      lab:'World Series', model:'ws_pct', mkt:'ws_implied_pct', odds:'ws_odds'},
];
// Edges tab: flat columns, one model at a time (Playoff-Picture style)
const MCOLS=[
 {k:'odds',lab:'Listed'},{k:'mkt',lab:'Mkt%'},{k:'model',lab:'MODEL'},{k:'edge',lab:'Edge'},
];
let DATA={mine:null,blend:null}, MKT={};
let curTab='proj', projSrc='mine', edgeLg='ALL', edgeModel='mine', edgeVig='raw';
let sortK='ws_pct', dir=-1;          // Projections tables
let mSortK='edge', mDir=-1;          // Edges tables (default: biggest edge first)
const num=v=>(v==null||isNaN(v))?null:+v;
const fmt=v=>v==null?'<span class="dash">—</span>':(v>=99.95?'100':(v<0.05?'0':v.toFixed(1)))+'%';
const fmtOdds=o=>o==null?'':((o>0?'+':'')+o);
const pctToAmerican=p=>{
  if(p==null) return null;
  const q=Math.max(0.2,Math.min(99.8,p));
  if(q===50) return 100;
  return q>50 ? Math.round(-(q/(100-q))*100) : Math.round(((100-q)/q)*100);
};
const fmtAm=o=>o==null?'—':(o>0?'+'+o:String(o));
function fairStack(pct){
  if(pct==null) return '<td class="mkc"><span class="dash">—</span></td>';
  return `<td class="mkc"><div class="p">${fmtAm(pctToAmerican(pct))}</div><div class="fo">${fmt(pct)}</div></td>`;
}
function mktStack(odds, implied){
  if(odds==null && implied==null) return '<td class="mkc mkt"><span class="dash">—</span></td>';
  return `<td class="mkc mkt"><div class="p">${odds!=null?fmtOdds(odds):'—'}</div><div class="fo">${fmt(implied)}</div></td>`;
}
// model column: edge on top (primary, colored + star), fair odds muted below
function modelEdgeCell(e, pct){
  if(e==null && pct==null) return '<td class="mkc"><span class="dash">—</span></td>';
  const cls=e==null?'flat':(e>=3?'pos':(e<=-3?'neg':'flat'));
  const star=(e!=null&&e>=4)?'★★★':(e!=null&&e>=2)?'★★':(e!=null&&e>=0.5)?'★':'';
  const eTxt=e==null?'—':((e>0?'+':'')+e.toFixed(1)+'%');
  const fair=pct!=null?fmtAm(pctToAmerican(pct)):'';
  return `<td class="mkc"><div class="p ${cls}">${eTxt}${star?'<span class="star"> '+star+'</span>':''}</div><div class="fo">${fair}</div></td>`;
}
// resize our own iframe to fit content on every render (fixes clipped 2nd table on tab switch)
function fit(){ try{ if(window.frameElement) window.frameElement.style.height=(document.body.scrollHeight+4)+'px'; }catch(e){} }

async function load(){
  try{
    const [sean,tf,v2]=await Promise.all([
      fetch(RAW+'sean_team_projections.json?cb='+Date.now()).then(r=>r.json()),
      fetch(RAW+'team_futures.json?cb='+Date.now()).then(r=>r.json()),
      fetch(RAW+'v2_marginalized.json?cb='+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    const mine={},blend={},mkt={};
    for(const[ab,t]of Object.entries(sean.teams)) mine[ab]={...t};
    // BARTOLO Pennant + WS come from Fable's pre-registered October engine
    // (v2_marginalized.json: pre-registered NB series model, priced on the frozen
    // 16-team field, marginalized over the season sim's seeding distribution). WC/LDS
    // round-survival stay from the season sim (v2 prices pennant + WS only). Composite
    // is untouched. AZ↔ARI reconciled for the board's abbreviations.
    if(v2){
      const V=ab=>({AZ:'ARI'}[ab]||ab);
      const ws=v2.ws||{}, pen={...(v2.al_pennant||{}),...(v2.nl_pennant||{})};
      const rds=v2.reach_ds||{}, rcs=v2.reach_cs||{};
      for(const[ab,p]of Object.entries(ws)){ const k=V(ab); if(mine[k]) mine[k].ws_pct=+(p*100).toFixed(1); }
      for(const[ab,p]of Object.entries(pen)){ const k=V(ab); if(mine[k]) mine[k].ws_app_pct=+(p*100).toFixed(1); }
      // Round survival from the v2 engine too (when present), so the whole BARTOLO
      // column reads one coherent model instead of borrowing WC/LDS from the season
      // sim (which produced the cross-engine artifact where pennant/LDS implied an
      // impossible LCS win rate). Falls back to the sim rounds if an older feed lacks them.
      if(Object.keys(rds).length){ for(const[ab,p]of Object.entries(rds)){ const k=V(ab); if(mine[k]) mine[k].reach_ds_pct=+(p*100).toFixed(1); } }
      if(Object.keys(rcs).length){ for(const[ab,p]of Object.entries(rcs)){ const k=V(ab); if(mine[k]) mine[k].reach_cs_pct=+(p*100).toFixed(1); } }
      window.__v2date=v2.date||'';
    }
    for(const[ab,t]of Object.entries(tf.teams)){ blend[ab]=t.composite||{}; mkt[ab]=t.market||{}; }
    DATA.mine=mine; DATA.blend=blend; MKT=mkt;
    const g=(sean.generated_at||'').slice(0,10);
    document.getElementById('asof').textContent=g?('as of '+g):'';
    render();
  }catch(e){ document.getElementById('roundGrid').innerHTML='<div class="err">Could not load feed: '+e.message+'</div>'; }
}
function contenders(rows){
  return Object.entries(rows).filter(([ab,t])=>num(t.playoff_pct)!=null && t.playoff_pct>=1);
}
function segHTML(opts, cur){
  return opts.map(o=>`<button data-v="${o.v}" class="${o.v===cur?'on':''}">${o.lab}</button>`).join('');
}
function render(){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===curTab));
  const isEdges = curTab==='edges';
  document.getElementById('roundGrid').style.display = isEdges?'none':'grid';
  document.getElementById('mktWrap').style.display = isEdges?'block':'none';
  const seg=document.getElementById('seg');
  seg.className='seg';
  if(isEdges){
    seg.className='segwrap';
    const grp=(name,opts,cur)=>`<span class="seg" data-grp="${name}">${segHTML(opts,cur)}</span>`;
    seg.innerHTML=
      grp('model',[{v:'mine',lab:'BARTOLO'},{v:'blend',lab:'Composite'}],edgeModel)
      +grp('lg',[{v:'ALL',lab:'All'},{v:'AL',lab:'AL'},{v:'NL',lab:'NL'}],edgeLg)
      +`<span class="seglab">Vig</span>`+grp('vig',[{v:'raw',lab:'Raw'},{v:'novig',lab:'No‑vig'}],edgeVig);
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const g=b.closest('.seg').dataset.grp, v=b.dataset.v;
      if(g==='model')edgeModel=v; else if(g==='lg')edgeLg=v; else edgeVig=v;
      render();});
    const mn=edgeModel==='mine'?'BARTOLO (v2 Oct engine)':'Composite';
    document.getElementById('srcnote').textContent = edgeVig==='novig'
      ? `${mn} vs market. Listed = best book price; Mkt% is de‑vigged (field normalized to 100%); Edge = ${mn} − no‑vig Mkt%.`
      : `${mn} vs market. Listed = best book price; Mkt% is the raw book implied %; Edge = ${mn} − Mkt%.`;
    document.getElementById('footnote').textContent =
      (edgeVig==='novig'?'No‑vig: market % normalized to 100% per field (pennant per league). ':'Raw book implied %. ')
      +'Edge = model − Mkt% · ★ 0.5 / ★★ 2 / ★★★ 4 · tap a header to sort';
    renderEdges();
  } else {
    seg.innerHTML=segHTML([{v:'mine',lab:'BARTOLO'},{v:'blend',lab:'Composite'}], projSrc);
    seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{projSrc=b.dataset.v;render();});
    document.getElementById('srcnote').textContent = projSrc==='mine'
      ? "BARTOLO: Pennant + WS from the pre-registered October series model (v2); WC/LDS from the season sim."
      : "Composite: equal-weight blend of PECOTA, FanGraphs, ATC, THE BAT, OOPSY and BARTOLO.";
    document.getElementById('footnote').textContent = projSrc==='mine'
      ? 'Odds to win each round · tap a header to sort · Model 70%+ series favourites have won 11 of 14 (2016–25) at a market average of 65%.'
      : 'Odds to win each round · tap a header to sort';
    renderRounds();
  }
  requestAnimationFrame(fit);
}
function renderRounds(){
  const rows=DATA[projSrc]; if(!rows) return;
  let tot=0;
  document.querySelectorAll('#roundGrid table[data-lg]').forEach(tbl=>{
    const lg=tbl.dataset.lg;
    let arr=contenders(rows).filter(([ab])=>LEAGUE[ab]===lg).map(([ab,t])=>({ab,t}));
    arr.sort((a,b)=>{const x=num(a.t[sortK]),y=num(b.t[sortK]);
      if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; return (x-y)*dir;});
    tot+=arr.length;
    tbl.querySelector('thead').innerHTML='<tr><th data-k="__tm">Team</th>'+COLS.map(c=>
      `<th data-k="${c.k}" class="${c.k===sortK?'on':''}">${c.lab}${c.k===sortK?`<span class="ar">${dir<0?'▼':'▲'}</span>`:''}</th>`).join('')+'</tr>';
    tbl.querySelectorAll('thead th').forEach(th=>th.onclick=()=>{
      const k=th.dataset.k; if(k==='__tm')return;
      if(k===sortK)dir*=-1; else{sortK=k;dir=-1;} render();});
    tbl.querySelector('tbody').innerHTML=arr.map(({ab,t})=>{
      const cells=COLS.map(c=>{
        const byePct=num((DATA.mine[ab]||{}).bye_pct);   // bye flag from the sim, applied to both toggles
        if(c.k==='reach_ds_pct' && byePct!=null && byePct>=50)
          return `<td class="b bye"><span class="v">BYE</span></td>`;
        const v=num(t[c.k]); const w=v==null?0:Math.max(0,Math.min(100,v));
        return `<td class="b ${c.ws?'ws':''} ${v==null?'na':''}">${v==null?'':`<span class="fill" style="width:${w}%"></span>`}<span class="v">${fmt(v)}</span></td>`;}).join('');
      return `<tr><td><span class="tm"><img src="${LOGO(ab)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">${ab}</span></td>${cells}</tr>`;
    }).join('');
  });
  document.getElementById('cnt').textContent=tot+' teams in contention';
}
// flat edge cell: edge value, colored, with star. Model % and Mkt% are plain columns.
function edgeCell(e){
  if(e==null) return '<td class="edg flat"><span class="dash">—</span></td>';
  const cls=e>=3?'pos':(e<=-3?'neg':'flat');
  const star=e>=4?'★★★':e>=2?'★★':e>=0.5?'★':'';
  return `<td class="edg ${cls}">${(e>0?'+':'')+e.toFixed(1)}%${star?`<span class="star">${star}</span>`:''}</td>`;
}
function renderEdges(){
  const wrap=document.getElementById('mktWrap');
  const src = edgeModel==='mine'?DATA.mine:DATA.blend;
  const mn  = edgeModel==='mine'?'BARTOLO':'Composite';
  const field = contenders(DATA.mine).map(([ab])=>ab);   // full field for devig sums
  let display = field.slice();
  if(edgeLg!=='ALL') display = display.filter(ab=>LEAGUE[ab]===edgeLg);
  let anyN=0;
  wrap.innerHTML=MKTS.map(M=>{
    // raw implied for the whole field, then consensus de-vig (normalize to 100%)
    const imp={}; field.forEach(ab=>{ imp[ab]=num((MKT[ab]||{})[M.mkt]); });
    // consensus de-vig = divide each implied by (field sum / 100). Only strip vig when the
    // field actually shows overround (sum > 100); if the market is still partly unpriced the
    // sum is understated, so we leave it raw rather than inflate the priced teams.
    const devig=(v,d)=> (v==null||!d)?null : (d>100 ? +(v/(d/100)).toFixed(1) : v);
    let fairOf;
    if(M.key==='pennant'){                                 // one champion per league → per-league sum
      const s={AL:0,NL:0}; field.forEach(ab=>{ if(imp[ab]!=null) s[LEAGUE[ab]]+=imp[ab]; });
      fairOf=ab=>devig(imp[ab], s[LEAGUE[ab]]);
    } else {                                               // one WS champ → whole-field sum
      let d=0; field.forEach(ab=>{ if(imp[ab]!=null) d+=imp[ab]; });
      fairOf=ab=>devig(imp[ab], d);
    }
    const rows=display.map(ab=>{
      const model=num((src[ab]||{})[M.model]);
      const raw=imp[ab], fair=fairOf(ab);
      const mkt = edgeVig==='novig'?fair:raw;
      const odds=num((MKT[ab]||{})[M.odds]);
      const edge=(model!=null&&mkt!=null)?+(model-mkt).toFixed(1):null;
      return {ab, odds, mkt, model, edge};
    }).filter(r=>r.model!=null||r.mkt!=null);
    rows.sort((a,b)=>{const x=a[mSortK],y=b[mSortK];
      if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; return (x-y)*mDir;});
    if(rows.some(r=>r.mkt!=null)) anyN++;
    const head='<tr><th data-k="__tm">Team</th>'+MCOLS.map(c=>{
      const lab=c.k==='model'?(mn+' %'):c.lab;
      return `<th data-k="${c.k}" class="${c.k===mSortK?'on':''}">${lab}${c.k===mSortK?`<span class="ar">${mDir<0?'▼':'▲'}</span>`:''}</th>`;
    }).join('')+'</tr>';
    const body=rows.map(r=>`<tr><td><span class="tm"><img src="${LOGO(r.ab)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">${r.ab}</span></td>`
      +`<td class="mut" title="best available book price">${r.odds!=null?fmtOdds(r.odds):'<span class=dash>—</span>'}</td>`
      +`<td class="mut">${fmt(r.mkt)}</td>`
      +`<td class="mdl">${fmt(r.model)}</td>`
      +edgeCell(r.edge)+`</tr>`).join('');
    return `<div class="lg"><div class="lghd">${M.lab}<span class="mk">— ${mn} vs market${edgeVig==='novig'?' · no‑vig':''}</span></div>`
      +`<div class="tblwrap"><table data-mkt="${M.key}"><thead>${head}</thead><tbody>${body}</tbody></table></div></div>`;
  }).join('');
  wrap.querySelectorAll('thead th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; if(k==='__tm')return;
    if(k===mSortK)mDir*=-1; else{mSortK=k;mDir=-1;} render();});
  const lgtxt = edgeLg==='ALL'?'':(' · '+edgeLg);
  document.getElementById('cnt').textContent = anyN? (display.length+' teams · pennant + WS'+lgtxt)
    : (display.length+' teams · WS priced (pennant odds pending next refresh)'+lgtxt);
}
document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{curTab=b.dataset.tab;render();});
load();
</script>
</body>
</html>
